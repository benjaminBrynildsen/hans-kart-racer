<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mario Kart Racer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
canvas { display: block; width: 100%; height: 100%; }

.overlay {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10; text-align: center;
  background: rgba(0,0,0,0.88);
  backdrop-filter: blur(8px);
  color: #fff; padding: 24px;
}
.overlay.hidden { display: none; }
.overlay h1 {
  font-size: 36px; font-weight: 900;
  background: linear-gradient(90deg, #ff0000, #ffdd00, #00cc00, #4488ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
}
.overlay .sub { font-size: 15px; opacity: 0.7; margin-bottom: 20px; }
.overlay .score-big { font-size: 52px; font-weight: 900; color: #ffd200; margin: 8px 0; }

.btn {
  padding: 16px 44px; border: none; border-radius: 16px;
  font-size: 20px; font-weight: 800; cursor: pointer;
  background: linear-gradient(135deg, #ff0000, #ffdd00);
  color: #fff; box-shadow: 0 6px 24px rgba(255,0,0,0.4);
  transition: transform 0.15s; margin-top: 12px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}
.btn:active { transform: scale(0.95); }

.char-select {
  display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; justify-content: center;
}
.char-btn {
  width: 60px; height: 60px; border-radius: 14px;
  border: 3px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08);
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; padding: 4px;
}
.char-btn img { width: 36px; height: 36px; image-rendering: pixelated; }
.char-btn span { font-size: 9px; color: #fff; opacity: 0.7; margin-top: 2px; }
.char-btn.active { border-color: #ffd200; background: rgba(255,210,0,0.2); transform: scale(1.1); }
</style>
</head>
<body>

<div class="overlay" id="startScreen">
  <h1>🍄 Mario Kart Racer</h1>
  <p class="sub">Dodge enemies & collect coins!</p>
  <div class="char-select" id="charSelect"></div>
  <button class="btn" id="startBtn">🏁 Race!</button>
</div>

<div class="overlay hidden" id="gameOverScreen">
  <div style="font-size:56px">💥</div>
  <h1>Game Over!</h1>
  <div class="score-big" id="finalScore">0</div>
  <p class="sub" id="finalDist">0m</p>
  <button class="btn" id="retryBtn">🔄 Race Again</button>
</div>

<canvas id="game"></canvas>

// Preload images
const images = {};
function loadImg(key, src) {
  const img = new Image();
  img.src = src;
  images[key] = img;
}
for (const [k,v] of Object.entries(SPRITE_DATA)) loadImg('char_'+k, v);
for (const [k,v] of Object.entries(ENEMY_SPRITES)) loadImg('enemy_'+k, v);
for (const [k,v] of Object.entries(ITEM_SPRITES)) loadImg('item_'+k, v);

const CHARACTERS = [
  { id: 'mario', name: 'Mario' },
  { id: 'luigi', name: 'Luigi' },
  { id: 'peach', name: 'Peach' },
  { id: 'toad', name: 'Toad' },
  { id: 'yoshi', name: 'Yoshi' },
  { id: 'bowser', name: 'Bowser' },
];

const ENEMIES = ['goomba','koopa','bobomb'];

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let running = false;
let selectedChar = 'mario';
let playerX = 0;
let playerTargetX = 0;
let speed = 0, maxSpeed = 8;
let distance = 0, score = 0;
let coins = [], obstacles = [], roadLines = [], particles = [], items = [];
let shakeTimer = 0, spawnTimer = 0, coinTimer = 0, itemTimer = 0;
let boosting = 0, invincible = 0, starPower = 0;
let steerInput = 0, touchSide = 0, tiltEnabled = false;

const ROAD_W_RATIO = 0.55;
const LANES = 3;

// Build character select
const charSelect = document.getElementById('charSelect');
CHARACTERS.forEach((c, i) => {
  const div = document.createElement('div');
  div.className = 'char-btn' + (i === 0 ? ' active' : '');
  div.dataset.char = c.id;
  div.innerHTML = `<img src="${SPRITE_DATA[c.id]}"><span>${c.name}</span>`;
  div.addEventListener('click', () => {
    document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
    div.classList.add('active');
    selectedChar = c.id;
  });
  charSelect.appendChild(div);
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

function startGame() {
  running = true;
  speed = 3; distance = 0; score = 0;
  playerX = 0; playerTargetX = 0;
  coins = []; obstacles = []; particles = []; items = [];
  roadLines = []; spawnTimer = 0; coinTimer = 0; itemTimer = 0;
  boosting = 0; shakeTimer = 0; invincible = 0; starPower = 0;
  for (let y = 0; y < H + 40; y += 40) roadLines.push({ y });
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');

  if (window.DeviceOrientationEvent) {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(r => { if (r==='granted') tiltEnabled=true; }).catch(()=>{});
    } else tiltEnabled = true;
  }
}

window.addEventListener('deviceorientation', e => {
  if (!tiltEnabled||!running) return;
  steerInput = Math.max(-1, Math.min(1, (e.gamma||0)/25));
});

canvas.addEventListener('touchstart', e => { e.preventDefault(); touchSide = e.touches[0].clientX < W/2 ? -1 : 1; }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); touchSide = e.touches[0].clientX < W/2 ? -1 : 1; }, {passive:false});
canvas.addEventListener('touchend', () => { touchSide = 0; });

const keys = {};
window.addEventListener('keydown', e => keys[e.key]=true);
window.addEventListener('keyup', e => keys[e.key]=false);

function getRoadBounds() {
  const roadW = W * ROAD_W_RATIO;
  const roadL = (W - roadW) / 2;
  return { roadL, roadW, roadR: roadL + roadW };
}
function laneToX(lane) {
  const {roadL,roadW} = getRoadBounds();
  return roadL + (roadW/LANES) * (lane + 0.5);
}
function playerScreenX() {
  const {roadL,roadW} = getRoadBounds();
  return roadL + roadW/2 + playerX * (roadW/2 - 24);
}

function update() {
  if (!running) return;

  if (boosting > 0) { speed = Math.min(maxSpeed*1.6, speed+0.2); boosting--; }
  else speed = Math.min(maxSpeed, speed + 0.002);
  distance += speed;
  score = Math.floor(distance / 10);

  let steer = 0;
  if (touchSide) steer = touchSide;
  else if (keys.ArrowLeft||keys.a) steer = -1;
  else if (keys.ArrowRight||keys.d) steer = 1;
  else if (tiltEnabled) steer = steerInput;

  playerTargetX += steer * 0.045;
  playerTargetX = Math.max(-0.92, Math.min(0.92, playerTargetX));
  playerX += (playerTargetX - playerX) * 0.15;

  roadLines.forEach(l => { l.y += speed; if (l.y > H+40) l.y -= H+80; });

  // Spawn enemies
  spawnTimer += speed;
  if (spawnTimer > Math.max(35, 180 - distance*0.004)) {
    spawnTimer = 0;
    const lane = Math.floor(Math.random()*LANES);
    const type = ENEMIES[Math.floor(Math.random()*ENEMIES.length)];
    const speedMult = Math.min(1+(distance*0.00005), 2);
    obstacles.push({
      x: laneToX(lane), y: -50, type,
      vy: speed * (0.3 + Math.random()*0.25) * speedMult,
    });
  }

  // Spawn coins
  coinTimer += speed;
  if (coinTimer > 70) {
    coinTimer = 0;
    const lane = Math.floor(Math.random()*LANES);
    coins.push({ x: laneToX(lane), y: -30 });
  }

  // Spawn items (mushroom/star)
  itemTimer += speed;
  if (itemTimer > 500) {
    itemTimer = 0;
    const lane = Math.floor(Math.random()*LANES);
    const type = Math.random() > 0.5 ? 'mushroom' : 'star';
    items.push({ x: laneToX(lane), y: -30, type });
  }

  const px = playerScreenX(), py = H - 70;

  // Obstacles
  for (let i = obstacles.length-1; i >= 0; i--) {
    const o = obstacles[i];
    o.y += speed - o.vy;
    if (o.y > H+60) { obstacles.splice(i,1); continue; }
    if (Math.abs(px-o.x) < 28 && Math.abs(py-o.y) < 34) {
      if (starPower > 0) {
        spawnParticles(o.x,o.y,12,'#ffd200');
        score += 100;
        obstacles.splice(i,1);
      } else if (invincible <= 0) {
        crash(); return;
      }
    }
  }

  // Coins
  for (let i = coins.length-1; i >= 0; i--) {
    const c = coins[i]; c.y += speed;
    if (c.y > H+30) { coins.splice(i,1); continue; }
    if (Math.abs(px-c.x) < 26 && Math.abs(py-c.y) < 26) {
      score += 50;
      spawnParticles(c.x,c.y,6,'#ffd200');
      coins.splice(i,1);
    }
  }

  // Items
  for (let i = items.length-1; i >= 0; i--) {
    const it = items[i]; it.y += speed;
    if (it.y > H+30) { items.splice(i,1); continue; }
    if (Math.abs(px-it.x) < 26 && Math.abs(py-it.y) < 26) {
      if (it.type === 'mushroom') { boosting = 90; spawnParticles(it.x,it.y,10,'#ff4444'); }
      else { starPower = 180; spawnParticles(it.x,it.y,15,'#ffff00'); }
      items.splice(i,1);
    }
  }

  // Particles
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) particles.splice(i,1);
  }

  if (shakeTimer > 0) shakeTimer--;
  if (invincible > 0) invincible--;
  if (starPower > 0) starPower--;
}

function crash() {
  running = false; shakeTimer = 20;
  spawnParticles(playerScreenX(), H-70, 30, '#ff4444');
  setTimeout(() => {
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalDist').textContent = Math.floor(distance)+'m';
    document.getElementById('gameOverScreen').classList.remove('hidden');
  }, 500);
}

function spawnParticles(x,y,count,color) {
  for (let i=0;i<count;i++) {
    const a = Math.random()*Math.PI*2, s = Math.random()*5+1;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*15,maxLife:35,size:2+Math.random()*4,color});
  }
}

function draw() {
  ctx.clearRect(0,0,W,H);
  if (shakeTimer>0) { ctx.save(); ctx.translate((Math.random()-.5)*10,(Math.random()-.5)*10); }

  const {roadL,roadW,roadR} = getRoadBounds();
  const laneW = roadW / LANES;

  // Grass
  ctx.fillStyle = '#2d8a2d'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#2a7d2a';
  roadLines.forEach(l => { ctx.fillRect(0,l.y,roadL-4,18); ctx.fillRect(roadR+4,l.y,W-roadR,18); });

  // Road
  ctx.fillStyle = '#444'; ctx.fillRect(roadL,0,roadW,H);
  // Curbs (red/white)
  for (let y = 0; y < H; y += 20) {
    ctx.fillStyle = (Math.floor(y/20) + Math.floor(distance/20)) % 2 ? '#cc0000' : '#fff';
    ctx.fillRect(roadL-6, y, 6, 10);
    ctx.fillRect(roadR, y, 6, 10);
  }

  // Lane dashes
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i=1;i<LANES;i++) {
    const lx = roadL + laneW*i - 1.5;
    roadLines.forEach(l => ctx.fillRect(lx,l.y,3,20));
  }

  // Boost lines
  if (boosting > 0 || starPower > 0) {
    const c = starPower > 0 ? 'rgba(255,255,0,' : 'rgba(0,210,255,';
    ctx.strokeStyle = c + (0.2+Math.random()*0.2)+')';
    ctx.lineWidth = 2;
    for (let i=0;i<8;i++) {
      const sx = roadL+Math.random()*roadW, sy = Math.random()*H;
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx,sy+25+Math.random()*20); ctx.stroke();
    }
  }

  // Draw items (coin, mushroom, star)
  coins.forEach(c => drawSprite('item_coin', c.x, c.y, 28));
  items.forEach(it => drawSprite('item_'+it.type, it.x, it.y, 30));

  // Draw enemies
  obstacles.forEach(o => drawSprite('enemy_'+o.type, o.x, o.y, 44));

  // Draw player
  const px = playerScreenX(), py = H - 70;
  if (starPower > 0) {
    // Rainbow glow
    ctx.shadowColor = ['#f00','#ff0','#0f0','#00f','#f0f'][Math.floor(Date.now()/80)%5];
    ctx.shadowBlur = 20;
  }
  drawSprite('char_'+selectedChar, px, py, 48);
  ctx.shadowBlur = 0;

  // Exhaust
  if (running && Math.random()>0.4) {
    particles.push({
      x:px+(Math.random()-.5)*10, y:py+24,
      vx:(Math.random()-.5)*1, vy:2+Math.random()*2,
      life:8+Math.random()*6, maxLife:14,
      size:2+Math.random()*3,
      color: starPower>0?'#ff0':boosting>0?'#f44':'#888',
    });
  }

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life/p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // HUD
  if (running) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,38);
    ctx.font = 'bold 15px system-ui'; ctx.textBaseline = 'middle';
    ctx.textAlign = 'left'; ctx.fillStyle = '#ffd200';
    ctx.fillText('🪙 '+score, 12, 20);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(Math.floor(distance)+'m', W/2, 20);
    ctx.textAlign = 'right';
    ctx.fillStyle = starPower>0?'#ff0':boosting>0?'#0df':'#fff';
    ctx.fillText(Math.floor(speed*15)+' km/h', W-12, 20);
  }

  if (shakeTimer>0) ctx.restore();
}

function drawSprite(key, x, y, size) {
  const img = images[key];
  if (img && img.complete) {
    ctx.drawImage(img, x-size/2, y-size/2, size, size);
  } else {
    // Fallback circle
    ctx.fillStyle = '#f0f';
    ctx.beginPath(); ctx.arc(x,y,size/3,0,Math.PI*2); ctx.fill();
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
