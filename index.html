<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kart Racer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
canvas { display: block; width: 100%; height: 100%; }

.overlay {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10; text-align: center;
  background: rgba(0,0,0,0.88);
  backdrop-filter: blur(8px);
  color: #fff; padding: 24px;
}
.overlay.hidden { display: none; }
.overlay h1 {
  font-size: 38px; font-weight: 900;
  background: linear-gradient(90deg, #ff4444, #ffdd00, #44ff44, #4488ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
}
.overlay .sub { font-size: 15px; opacity: 0.7; margin-bottom: 20px; }
.overlay .score-big { font-size: 52px; font-weight: 900; color: #ffd200; margin: 8px 0; }

.btn {
  padding: 16px 44px; border: none; border-radius: 16px;
  font-size: 20px; font-weight: 800; cursor: pointer;
  background: linear-gradient(135deg, #ff4444, #ffdd00);
  color: #fff; box-shadow: 0 6px 24px rgba(255,68,68,0.4);
  transition: transform 0.15s; margin-top: 12px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}
.btn:active { transform: scale(0.95); }

.char-select {
  display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; justify-content: center;
}
.char-btn {
  width: 64px; height: 64px; border-radius: 16px;
  border: 3px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08);
  font-size: 36px; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.char-btn.active { border-color: #ffd200; background: rgba(255,210,0,0.2); transform: scale(1.1); }

.controls-hint {
  position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.4); font-size: 12px; z-index: 5;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="overlay" id="startScreen">
  <div style="font-size:64px;margin-bottom:4px">🏎️</div>
  <h1>Kart Racer</h1>
  <p class="sub">Dodge traffic & collect coins!</p>
  <div class="char-select" id="charSelect">
    <div class="char-btn active" data-char="🏎️">🏎️</div>
    <div class="char-btn" data-char="🏍️">🏍️</div>
    <div class="char-btn" data-char="🚗">🚗</div>
    <div class="char-btn" data-char="🚙">🚙</div>
    <div class="char-btn" data-char="🏁">🏁</div>
  </div>
  <button class="btn" id="startBtn">🏁 Race!</button>
</div>

<div class="overlay hidden" id="gameOverScreen">
  <div style="font-size:56px">💥</div>
  <h1>Crash!</h1>
  <div class="score-big" id="finalScore">0</div>
  <p class="sub" id="finalDist">0m</p>
  <button class="btn" id="retryBtn">🔄 Race Again</button>
</div>

<canvas id="game"></canvas>
<div class="controls-hint" id="hint">← Tilt or touch sides to steer →</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Game vars
let running = false;
let playerChar = '🏎️';
let playerX = 0; // -1 to 1 (lane position)
let playerTargetX = 0;
let speed = 0;
let maxSpeed = 8;
let distance = 0;
let score = 0;
let coins = [];
let obstacles = [];
let roadLines = [];
let particles = [];
let boosts = [];
let shakeTimer = 0;
let spawnTimer = 0;
let coinTimer = 0;
let boostTimer = 0;
let boosting = 0;
let steerInput = 0; // -1 left, 0 center, 1 right
let touchSide = 0;
let tiltEnabled = false;

// Road params
const ROAD_W_RATIO = 0.6; // road is 60% of screen width
const LANES = 3;

// Characters for obstacles
const TRAFFIC = ['🚌','🚐','🚛','🚕','🚓','🚑','🚒','🛻'];
const COIN_EMOJI = '🪙';
const BOOST_EMOJI = '⚡';

// Character select
document.querySelectorAll('.char-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    playerChar = btn.dataset.char;
  });
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

function startGame() {
  running = true;
  speed = 3; distance = 0; score = 0;
  playerX = 0; playerTargetX = 0;
  coins = []; obstacles = []; particles = []; boosts = [];
  roadLines = [];
  spawnTimer = 0; coinTimer = 0; boostTimer = 0;
  boosting = 0; shakeTimer = 0;

  // Init road lines
  for (let y = 0; y < H + 40; y += 40) {
    roadLines.push({ y });
  }

  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('hint').style.display = '';

  // Try gyroscope
  if (window.DeviceOrientationEvent) {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(r => {
        if (r === 'granted') tiltEnabled = true;
      }).catch(() => {});
    } else {
      tiltEnabled = true;
    }
  }
}

// Controls — tilt
window.addEventListener('deviceorientation', e => {
  if (!tiltEnabled || !running) return;
  const gamma = e.gamma || 0; // -90 to 90, left/right tilt
  steerInput = Math.max(-1, Math.min(1, gamma / 25));
});

// Controls — touch (left/right halves)
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const x = e.touches[0].clientX;
  touchSide = x < W / 2 ? -1 : 1;
  document.getElementById('hint').style.display = 'none';
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const x = e.touches[0].clientX;
  touchSide = x < W / 2 ? -1 : 1;
}, {passive: false});
canvas.addEventListener('touchend', e => { touchSide = 0; });

// Controls — keyboard
const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

function getRoadBounds() {
  const roadW = W * ROAD_W_RATIO;
  const roadL = (W - roadW) / 2;
  return { roadL, roadW, roadR: roadL + roadW };
}

function laneToX(lane) {
  const { roadL, roadW } = getRoadBounds();
  const laneW = roadW / LANES;
  return roadL + laneW * (lane + 0.5);
}

function playerScreenX() {
  const { roadL, roadW } = getRoadBounds();
  return roadL + roadW / 2 + playerX * (roadW / 2 - 24);
}

function update() {
  if (!running) return;

  // Speed gradually increases
  if (boosting > 0) {
    speed = Math.min(maxSpeed * 1.8, speed + 0.3);
    boosting--;
  } else {
    speed = Math.min(maxSpeed, speed + 0.002);
  }

  distance += speed;
  score = Math.floor(distance / 10);

  // Steering
  let steer = 0;
  if (touchSide !== 0) steer = touchSide;
  else if (keys['ArrowLeft'] || keys['a']) steer = -1;
  else if (keys['ArrowRight'] || keys['d']) steer = 1;
  else if (tiltEnabled) steer = steerInput;

  playerTargetX += steer * 0.04;
  playerTargetX = Math.max(-0.92, Math.min(0.92, playerTargetX));
  playerX += (playerTargetX - playerX) * 0.15;

  // Road lines scroll
  roadLines.forEach(l => {
    l.y += speed;
    if (l.y > H + 40) l.y -= H + 80;
  });

  // Spawn obstacles
  spawnTimer += speed;
  const spawnGap = Math.max(90, 200 - distance * 0.005);
  if (spawnTimer > spawnGap) {
    spawnTimer = 0;
    const lane = Math.floor(Math.random() * LANES);
    const emoji = TRAFFIC[Math.floor(Math.random() * TRAFFIC.length)];
    obstacles.push({
      x: laneToX(lane),
      y: -50,
      emoji,
      w: 36, h: 44,
      speed: speed * (0.3 + Math.random() * 0.3), // slower than player
    });
  }

  // Spawn coins
  coinTimer += speed;
  if (coinTimer > 80) {
    coinTimer = 0;
    const lane = Math.floor(Math.random() * LANES);
    coins.push({ x: laneToX(lane), y: -30, collected: false });
  }

  // Spawn boost
  boostTimer += speed;
  if (boostTimer > 600) {
    boostTimer = 0;
    const lane = Math.floor(Math.random() * LANES);
    boosts.push({ x: laneToX(lane), y: -30 });
  }

  const px = playerScreenX();
  const py = H - 70;

  // Update obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.y += speed - o.speed;
    if (o.y > H + 60) { obstacles.splice(i, 1); continue; }

    // Collision
    const dx = Math.abs(px - o.x);
    const dy = Math.abs(py - o.y);
    if (dx < 30 && dy < 36) {
      crash();
      return;
    }
  }

  // Update coins
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.y += speed;
    if (c.y > H + 30) { coins.splice(i, 1); continue; }
    if (!c.collected) {
      const dx = Math.abs(px - c.x); const dy = Math.abs(py - c.y);
      if (dx < 28 && dy < 28) {
        c.collected = true;
        score += 50;
        spawnParticles(c.x, c.y, 8, '#ffd200');
        coins.splice(i, 1);
      }
    }
  }

  // Update boosts
  for (let i = boosts.length - 1; i >= 0; i--) {
    const b = boosts[i];
    b.y += speed;
    if (b.y > H + 30) { boosts.splice(i, 1); continue; }
    const dx = Math.abs(px - b.x); const dy = Math.abs(py - b.y);
    if (dx < 28 && dy < 28) {
      boosting = 90;
      spawnParticles(b.x, b.y, 12, '#00d2ff');
      boosts.splice(i, 1);
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (shakeTimer > 0) shakeTimer--;
}

function crash() {
  running = false;
  shakeTimer = 20;
  spawnParticles(playerScreenX(), H - 70, 30, '#ff4444');
  spawnParticles(playerScreenX(), H - 70, 20, '#ffd200');
  setTimeout(() => {
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalDist').textContent = Math.floor(distance) + 'm';
    document.getElementById('gameOverScreen').classList.remove('hidden');
  }, 600);
}

function spawnParticles(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 5 + 1;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 25+Math.random()*15, maxLife: 40, size: 2+Math.random()*4, color });
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  if (shakeTimer > 0) {
    ctx.save();
    ctx.translate((Math.random()-0.5)*10, (Math.random()-0.5)*10);
  }

  const { roadL, roadW, roadR } = getRoadBounds();
  const laneW = roadW / LANES;

  // Grass
  ctx.fillStyle = '#2d8a2d';
  ctx.fillRect(0, 0, W, H);

  // Grass stripes (scrolling)
  ctx.fillStyle = '#2a7d2a';
  roadLines.forEach(l => {
    ctx.fillRect(0, l.y, roadL - 4, 18);
    ctx.fillRect(roadR + 4, l.y, W - roadR, 18);
  });

  // Road
  ctx.fillStyle = '#333';
  ctx.fillRect(roadL, 0, roadW, H);

  // Road edge lines
  ctx.fillStyle = '#fff';
  ctx.fillRect(roadL - 3, 0, 3, H);
  ctx.fillRect(roadR, 0, 3, H);

  // Lane dashes
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  for (let i = 1; i < LANES; i++) {
    const lx = roadL + laneW * i - 1.5;
    roadLines.forEach(l => {
      ctx.fillRect(lx, l.y, 3, 20);
    });
  }

  // Speed lines when boosting
  if (boosting > 0) {
    ctx.strokeStyle = `rgba(0,210,255,${0.3 + Math.random()*0.2})`;
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const sx = roadL + Math.random() * roadW;
      const sy = Math.random() * H;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + 30 + Math.random()*20);
      ctx.stroke();
    }
  }

  // Coins
  ctx.font = '28px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  coins.forEach(c => {
    ctx.fillText(COIN_EMOJI, c.x, c.y);
  });

  // Boosts
  ctx.font = '30px serif';
  boosts.forEach(b => {
    ctx.fillText(BOOST_EMOJI, b.x, b.y);
  });

  // Obstacles
  obstacles.forEach(o => {
    ctx.font = `${o.h}px serif`;
    ctx.fillText(o.emoji, o.x, o.y);
  });

  // Player
  const px = playerScreenX();
  const py = H - 70;
  if (running || Math.floor(Date.now()/100)%2) {
    ctx.font = '42px serif';
    ctx.fillText(playerChar, px, py);

    // Exhaust particles
    if (running && Math.random() > 0.5) {
      const side = (Math.random() - 0.5) * 10;
      particles.push({
        x: px + side, y: py + 24,
        vx: (Math.random()-0.5)*1, vy: 2 + Math.random()*2,
        life: 10+Math.random()*8, maxLife: 18,
        size: 2+Math.random()*3,
        color: boosting > 0 ? '#00d2ff' : '#888',
      });
    }
  }

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // HUD
  if (running) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, 40);

    ctx.font = 'bold 16px system-ui';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd200';
    ctx.fillText(`⭐ ${score}`, 12, 26);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.fillText(`${Math.floor(distance)}m`, W/2, 26);

    ctx.textAlign = 'right';
    const kmh = Math.floor(speed * 15);
    ctx.fillStyle = boosting > 0 ? '#00d2ff' : '#fff';
    ctx.fillText(`${kmh} km/h`, W - 12, 26);
  }

  if (shakeTimer > 0) ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
